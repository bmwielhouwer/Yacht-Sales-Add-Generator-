<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compass Line Marine — Listing Generator</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --ink: #0f1e2e;
        --muted: #5b6b7a;
        --line: #d9e0e8;
        --accent: #0b4f6c;
        --accent-hover: #093e57;
        --danger: #b3261e;
        --good: #1d6b3a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      .container { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
      header { margin-bottom: 24px; }
      header h1 { margin: 0 0 4px; font-size: 24px; }
      header p { margin: 0; color: var(--muted); font-size: 14px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }
      label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
      .hint { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
      textarea, input[type="text"] {
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fafbfc;
        resize: vertical;
        color: var(--ink);
      }
      textarea:focus, input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        background: #fff;
      }
      textarea.notes { min-height: 180px; }
      textarea.urls { min-height: 80px; }
      .field + .field { margin-top: 16px; }
      .actions { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
      button.primary {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary:hover:not(:disabled) { background: var(--accent-hover); }
      button.primary:disabled { opacity: 0.6; cursor: wait; }
      button.copy {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button.copy:hover { border-color: var(--accent); color: var(--accent); }
      .status { font-size: 13px; color: var(--muted); }
      .status.error { color: var(--danger); }
      .status.good { color: var(--good); }
      .results { display: none; }
      .results.show { display: block; }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .section-head h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
      .output {
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        margin: 0;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .gap {
        background: #fff8e1;
        border-left: 3px solid #d4a017;
        padding: 10px 14px;
        border-radius: 4px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .gap strong { color: #7a5a00; }
      details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
      details { margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Compass Line Marine — Listing Generator</h1>
        <p>Paste broker notes, optionally add photo URLs, and get a full listing package.</p>
      </header>

      <form id="form" class="card">
        <div class="field">
          <label for="notes">Broker notes <span class="hint">free-form — year, make, model, engines, hours, history, condition, price, contact</span></label>
          <textarea id="notes" class="notes" placeholder="2018 Sea Ray Sundancer 370. 37' LOA. Twin MerCruiser 350 MAG, 320 hours total. Freshwater only..." required></textarea>
        </div>
        <div class="field">
          <label for="urls">Photo URLs <span class="hint">optional — one per line, public https links</span></label>
          <textarea id="urls" class="urls" placeholder="https://example.com/boat-starboard.jpg&#10;https://example.com/boat-helm.jpg"></textarea>
        </div>
        <div class="actions">
          <button type="submit" class="primary" id="submit">Generate listing</button>
          <span class="status" id="status"></span>
        </div>
      </form>

      <div id="results" class="results"></div>
    </div>

    <script>
      const SECTIONS = [
        { key: "long_description", title: "Long description (YachtWorld / Boat Trader)" },
        { key: "facebook_marketplace", title: "Facebook Marketplace" },
        { key: "facebook_post", title: "Facebook post" },
        { key: "instagram_caption", title: "Instagram caption" },
        { key: "instagram_hashtags", title: "Instagram hashtags" },
        { key: "linkedin_post", title: "LinkedIn post" },
        { key: "email_blast", title: "Email blast" },
        { key: "photo_order", title: "Recommended photo order" },
      ];

      const form = document.getElementById("form");
      const submit = document.getElementById("submit");
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      function setStatus(text, kind = "") {
        status.textContent = text;
        status.className = "status" + (kind ? " " + kind : "");
      }

      function escape(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }

      function formatSection(key, value) {
        if (key === "instagram_hashtags" && Array.isArray(value)) {
          return value.map((t) => (t.startsWith("#") ? t : "#" + t)).join(" ");
        }
        if (key === "photo_order" && Array.isArray(value)) {
          return value.join(", ");
        }
        if (key === "email_blast" && value && typeof value === "object") {
          return "Subject: " + value.subject + "\n\n" + value.body;
        }
        return typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      function renderResults(data) {
        const { listing, boatData, photoSummary } = data;
        const parts = [];

        const gaps = photoSummary?.missing_categories ?? [];
        const issues = photoSummary?.quality_issues ?? [];
        if (gaps.length || issues.length) {
          parts.push(
            `<div class="gap"><strong>Photo gap report:</strong> ${
              gaps.length ? "missing — " + escape(gaps.join(", ")) : ""
            }${gaps.length && issues.length ? " · " : ""}${
              issues.length ? "issues — " + escape(issues.join("; ")) : ""
            }</div>`
          );
        }

        for (const { key, title } of SECTIONS) {
          if (!(key in listing)) continue;
          const text = formatSection(key, listing[key]);
          parts.push(`
            <div class="card">
              <div class="section-head">
                <h3>${escape(title)}</h3>
                <button class="copy" data-text="${escape(text)}">Copy</button>
              </div>
              <pre class="output">${escape(text)}</pre>
            </div>
          `);
        }

        parts.push(`
          <details>
            <summary>Show extracted boat data + photo summary (JSON)</summary>
            <pre class="output" style="margin-top:10px;">${escape(
              JSON.stringify({ boatData, photoSummary }, null, 2)
            )}</pre>
          </details>
        `);

        results.innerHTML = parts.join("");
        results.classList.add("show");

        results.querySelectorAll("button.copy").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(btn.dataset.text);
              const orig = btn.textContent;
              btn.textContent = "Copied";
              setTimeout(() => (btn.textContent = orig), 1200);
            } catch {
              btn.textContent = "Copy failed";
            }
          });
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const rawInput = document.getElementById("notes").value.trim();
        const photoUrls = document
          .getElementById("urls")
          .value.split("\n")
          .map((s) => s.trim())
          .filter(Boolean);

        if (!rawInput) {
          setStatus("Add broker notes first.", "error");
          return;
        }

        submit.disabled = true;
        results.classList.remove("show");
        results.innerHTML = "";
        setStatus("Generating… this typically takes 20–45 seconds.");

        try {
          const res = await fetch("/api/generate-listing", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rawInput, photoUrls }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          setStatus("Done.", "good");
          renderResults(data);
        } catch (err) {
          setStatus("Error: " + err.message, "error");
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
